<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lobby</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/background.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/lobby.css">
    <link rel="stylesheet" href="../css/room.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

<div class="background">
    <div class="bg-light bg-light-1"></div>
    <div class="bg-light bg-light-2"></div>
</div>

<main class="lobby">

    <div class="lobby-content">

        <header class="lobby-header">

            <div>
                <h1 class="lobby-title">Lobby</h1>
                <p class="muted">
                    Aguarde os jogadores
                </p>
            </div>

            <div class="room-code-box">

                <span>Código da sala</span>

                <strong id="roomCode">
                    ------
                </strong>

            </div>

        </header>

        <div class="lobby-grid">

            <section class="lobby-card">

                <h2>Jogadores</h2>

                <div class="player-list" id="playerList">

                    <div class="player-slot">

                        <div class="player-avatar">
                            👤
                        </div>

                        <div>
                            <div
                                class="player-name"
                                id="playerName">
                                Jogador
                            </div>

                            <div class="player-status">
                                ONLINE
                            </div>
                        </div>

                    </div>

                </div>

            </section>

            <section class="lobby-card">

                <h2>Partida</h2>

                <p class="muted">
                    Quando todos estiverem prontos,
                    o anfitrião poderá iniciar a partida.
                </p>

                <div class="lobby-actions">

                    <button
                        class="lobby-button"
                        onclick="copyCode()">
                        COPIAR CÓDIGO
                    </button>

                    <button
                        class="lobby-button"
                        onclick="startGame()">
                        INICIAR
                    </button>

                </div>

                <br>

                <button
                    class="lobby-button"
                    onclick="location.href='../index.html'">
                    SAIR DA SALA
                </button>

            </section>

        </div>

    </div>

</main>

<script>

const name =
    localStorage.getItem("playerName") || "Jogador";

const savedCode =
    localStorage.getItem("roomCode");

document.getElementById("playerName").textContent = name;

if (savedCode) {
    document.getElementById("roomCode").textContent = savedCode;
} else {

    const generated =
        Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();

    document.getElementById("roomCode").textContent = generated;

    localStorage.setItem("roomCode", generated);
}

function copyCode() {

    const code =
        document.getElementById("roomCode").textContent;

    navigator.clipboard.writeText(code);

    alert("Código copiado: " + code);
}

function startGame() {
    location.href = "game.html";
}

</script>

</body>
</html>
